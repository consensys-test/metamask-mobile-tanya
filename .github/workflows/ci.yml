name: ci
on:
  pull_request:
  push:
    branches: [main, stable, 'release/**']
jobs:
  smoke:
    name: Appium Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Fail the first attempt
        run: |
          echo "attempt ${{ github.run_attempt }}"
          if [ "${{ github.run_attempt }}" -eq 1 ]; then
            echo "ETIMEDOUT talking to the runner"
            exit 1
          fi
          echo "ok"
